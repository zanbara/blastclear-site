# ════════════════════════════════════════════════════════════════════════════════
#  PUBLICATION DU SITE SUR GITHUB PAGES
#
#  ─── POURQUOI UN WORKFLOW, ET NON LE RÉGLAGE SIMPLE ───────────────────────────
#  GitHub Pages, dans son mode « une branche et un dossier », n'accepte que DEUX
#  dossiers : la racine du dépôt, ou /docs. Rien d'autre. Or ce qui doit être publié
#  vit dans /site, et /docs porte déjà les procédures d'exploitation.
#
#  Les deux seules issues sans workflow seraient de publier la racine, ce qui
#  servirait aussi le README, les scripts et la charte, ou de renommer /site en
#  /docs, ce qui obligerait à déplacer les procédures et rendrait le dépôt
#  illisible.
#
#  Le workflow lève la contrainte : il n'envoie à Pages que le contenu de /site.
#
#  ─── CE QU'IL NE FAIT PAS ─────────────────────────────────────────────────────
#  Il ne relance PAS la conversion des canevas. Ceux-ci ne sont pas versionnés, et
#  les pages de /site sont générées sur le poste puis validées. Ce workflow ne fait
#  que publier ce qui est déjà dans le dépôt.
#
#  ─── ET CE QU'IL FAIT EN PLUS, DEPUIS LE 15 SEPTEMBRE 2026 ────────────────────
#  Il prévient les moteurs de recherche, par le protocole IndexNow, des seules
#  adresses qui viennent de changer. Voir le commentaire de l'étape concernée.
# ════════════════════════════════════════════════════════════════════════════════

name: Publier le site

on:
  push:
    branches: [main]
  # Permet de republier à la demande, sans avoir à pousser un commit vide.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois. cancel-in-progress reste à false : interrompre
# un déploiement en cours laisserait le site dans un état intermédiaire.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          # L'HISTORIQUE COMPLET, POUR UNE SEULE RAISON : savoir CE QUI A CHANGÉ.
          # L'étape IndexNow ne prévient les moteurs que des adresses réellement
          # modifiées, et cela demande de comparer deux états du dépôt. Une copie
          # superficielle n'en contient qu'un.
          fetch-depth: 0

      - name: Préparer Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le dossier site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4

      # ══════════════════════════════════════════════════════════════════════════
      #  PRÉVENIR LES MOTEURS, PAR INDEXNOW
      #
      #  ─── CE QUE CELA CHANGE ────────────────────────────────────────────────
      #  Un moteur repasse sur un site neuf quand il le décide, ce qui peut
      #  prendre des semaines. IndexNow inverse le sens : le site annonce lui-même
      #  qu'une page a changé, et le moteur vient la chercher dans l'heure.
      #  Bing, Yandex, Seznam, Naver et Yep partagent le même point d'entrée : une
      #  seule annonce les atteint tous.
      #
      #  GOOGLE N'EN FAIT PAS PARTIE, et c'est à savoir. Il a essayé le protocole
      #  puis s'en est tenu à l'écart. Pour lui, le plan du site et la Search
      #  Console restent les seuls leviers — voir docs/referencement.md.
      #
      #  ─── POURQUOI SEULEMENT LES ADRESSES MODIFIÉES ─────────────────────────
      #  Le protocole demande de n'annoncer que ce qui a changé. Réannoncer les
      #  vingt-six adresses à chaque envoi, y compris pour une correction de
      #  feuille de style, ferait perdre au signal ce qui en fait la valeur : sa
      #  rareté. Les moteurs limitent d'ailleurs les domaines qui en abusent.
      #
      #  ─── ET POURQUOI APRÈS LE DÉPLOIEMENT, JAMAIS AVANT ────────────────────
      #  Le moteur vient chercher la page dans les minutes qui suivent l'annonce.
      #  Annoncée avant, il trouverait l'ancienne, et l'enregistrerait comme
      #  étant la nouvelle.
      # ══════════════════════════════════════════════════════════════════════════
      - name: Prévenir les moteurs (IndexNow)
        # Un échec ici ne doit pas colorer en rouge une publication réussie : le
        # site est en ligne, seule l'annonce a manqué.
        continue-on-error: true
        env:
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.sha }}
          MANUEL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 .github/indexnow.py
